manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: refil
      url-base: https://github.com/refil
  projects:
    - name: zmk
      remote: refil
      revision: adv360-z3.5-2
      import:
        file: app/west.yml
        name-allowlist:
          - zephyr
          - cmsis
          - hal_nordic
          - tinycrypt
          - lvgl
          - segger
          - nanopb
          - zmk-studio-messages
  self:
    path: config
